services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend

    container_name: blog_backend

    ports:
      - "8000:8000"

    volumes:
      - ./data/blogs:/app/data/blogs

    env_file:
      - .env

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend

    container_name: blog_frontend

    ports:
      - "8501:8501"

    depends_on:
      - backend

    env_file:
      - .env